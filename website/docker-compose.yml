services:
  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: sam_user
      POSTGRES_PASSWORD: sam_password
      POSTGRES_DB: sam_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sam_user -d sam_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://sam_user:sam_password@db:5432/sam_db
      SECRET_KEY: sam_secret_jwt_key_enterprise
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
